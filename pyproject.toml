[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-inventory"
version = "0.1.0"
description = "CLI para rastrear estoque de itens domésticos e gerar lista de compras priorizada."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
bot = ["python-telegram-bot>=21"]
llm = ["anthropic>=0.40"]

[project.scripts]
inv = "home_inventory.cli:app"
inv-bot = "home_inventory.telegram_bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
